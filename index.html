${p.map?`<a href="${esc(p.map)}" target="_blank" style="color:#ffb800">🗺 Google Maps</a> `:''}
<div class="dthumbs">${ph.map(x=>`<img src="${esc(x.url)}" data-lb="1" data-cap="${esc(p.name)}" loading="lazy">`).join('')}</div></div>`}
function view(){const b=$('dbody');const dm='';
$('dtabs').innerHTML=[['proj','Projects'],['site','Sites'],['ph','Site Photos'],['reel','Project Videos']].map(t=>`<button data-t="${t[0]}" class="${tab===t[0]?'on':''}">${t[1]}</button>`).join('');
const bar=`<div class="dbar"><input id="dq" placeholder="Search name, customer, location, kW, date" value="${esc(q)}"></div>`;
if(tab==='proj')b.innerHTML=dm+bar+(P.filter(match).map(p=>card(p)).join('')||'<p class="dcard">No projects</p>');
else if(tab==='site'){const f=S.filter(s=>!q||[s.name,s.location].join(' ').toLowerCase().includes(q.toLowerCase())),ms={};f.forEach(s=>{const k=(s.date||'').slice(0,7)||'No date';(ms[k]=ms[k]||[]).push(s)});b.innerHTML=dm+bar+(Object.keys(ms).sort().reverse().map(k=>`<div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px"><h3 style="color:#ffb800;margin:0">${k}</h3><button data-sm="${k}" style="background:#ffb800;color:#000;font-weight:700;border:0;border-radius:8px;padding:8px 12px">⬇ PDF</button></div>`+ms[k].map(s=>card(s,1)).join('')).join('')||'<p class="dcard">No sites</p>')}
else if(tab==='ph'){const grp=(t,arr)=>arr.map(x=>`<h3 style="color:#ffb800;margin-top:14px">${t} ${esc(x.name)}</h3>${photos(x).length?'':'<small style="color:#9fb3c0">No photos yet</small>'}<div class="dgal">${photos(x).map(p=>`<div style="position:relative"><img src="${esc(p.url)}" data-lb="1" data-cap="${esc(x.name)}" loading="lazy"><span class="dtag" style="position:absolute;left:6px;bottom:6px;max-width:90%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.name)}</span></div>`).join('')}</div>`).join('');b.innerHTML=dm+(grp('📍',P)||'No sites yet')}
else if(tab==='reel'){b.innerHTML=dm+`<div class="dgal">${R.map(r=>`<div>${r.url?`<video controls playsinline preload="metadata" ${r.url.indexOf('idb:')===0?`data-idb="${esc(r.url)}"`:`src="${esc(r.url)}"`} style="width:100%;aspect-ratio:9/16;border-radius:10px;background:#000"></video>`:r.link?`<iframe src="${esc(r.link)}" allow="autoplay" allowfullscreen style="width:100%;aspect-ratio:9/16;border:0;border-radius:10px"></iframe>`:'<div class="dcard">No video</div>'}<small>${esc(r.title)}</small></div>`).join('')||'No videos'}</div>`;b.querySelectorAll('video[data-idb]').forEach(el=>{window.idbGet(el.dataset.idb).then(u=>{if(u)el.src=u})})}}
function pdfSites(k){const L=S.filter(x=>((x.date||'').slice(0,7)||'No date')===k),w=window.open('','_blank');if(!w){alert('Allow popups');return}
w.document.write(`<html><head><title>Sites ${k}</title><style>@page{size:A4;margin:15mm}body{font-family:Arial}h1{border-bottom:3px solid #ffb800;padding-bottom:8px}ol{font-size:18px;line-height:1.9;column-count:2}</style></head><body><h1>Scope Solar – Sites (${k})</h1><ol>${L.map(x=>`<li>${esc(x.name)}</li>`).join('')||'<li>No sites</li>'}</ol></body></html>`);w.document.close();setTimeout(()=>w.print(),800)}
let pushed=false;
function reload(){return Promise.all([load('projects'),load('sites'),load('reels')]).then(r=>{P=r[0];S=P;R=r[2];view()})}
function open(){$('dash').classList.add('show');try{history.pushState({d:1},'');pushed=true}catch(e){}
$('dbody').textContent='Loading…';reload().catch(()=>{$('dbody').textContent='Data load failed'})}
function close(){$('dash').classList.remove('show');if(pushed){pushed=false;history.back()}}
window.addEventListener('popstate',()=>{pushed=false;$('dash').classList.remove('show')});
$('dback').onclick=close;
$('dash').addEventListener('click',e=>{const t=e.target;if(t.dataset.sm)pdfSites(t.dataset.sm);if(t.dataset.t){tab=t.dataset.t;view()}if(t.dataset.lb){$('dlb').querySelector('img').src=t.src;$('dcap').textContent=t.dataset.cap||'';$('dlb').style.display='flex'}});
$('dash').addEventListener('input',e=>{if(e.target.id==='dq'){q=e.target.value;const p=e.target.selectionStart;view();const n=$('dq');n.focus();n.setSelectionRange(p,p)}});
$('dash').addEventListener('change',e=>{if(e.target.id==='dst'){st=e.target.value;view()}});
setInterval(()=>{if(!demoMode&&$('dash').classList.contains('show')&&!document.activeElement.id)reload().catch(()=>{})},60000);
window.openDashboard=open;
window.ssDashRefresh=function(){if($('dash').classList.contains('show')&&!(document.activeElement&&document.activeElement.id))reload().catch(()=>{})};
})();

</script>
<script>

/* Videos come from your own Firebase (collection "videos") - added in Admin 1 */
let videos = [];
window.idbGet=function(u){return new Promise(function(ok){try{var r=indexedDB.open('ssblobs',1);r.onupgradeneeded=function(){r.result.createObjectStore('b')};r.onsuccess=function(){var q=r.result.transaction('b').objectStore('b').get(u.slice(4));q.onsuccess=function(){ok(q.result?URL.createObjectURL(q.result):'')};q.onerror=function(){ok('')}};r.onerror=function(){ok('')}}catch(e){ok('')}})};

function driveStream(id){
    return "https://drive.usercontent.google.com/download?id=" + encodeURIComponent(id) + "&export=download&confirm=t";
}

const vid     = document.getElementById('vid');
const seek    = document.getElementById('seek');
const playBtn = document.getElementById('playBtn');
const timeEl  = document.getElementById('time');
const speedEl = document.getElementById('speed');
const titleEl = document.getElementById('active-title');
const dlLink  = document.getElementById('download-link');
const listEl  = document.getElementById('video-list');

function fmt(t){
    if(!isFinite(t)) t = 0;
    const m = Math.floor(t/60);
    const s = Math.floor(t%60);
    return m + ":" + (s<10 ? "0" : "") + s;
}

const ctrl = document.querySelector('.ctrl');

function playVideo(index){
    const v = videos[index];
    titleEl.innerText = v.title;
    vid.dataset.try = v.url ? "9" : "1";
    vid.dataset.id = v.id || "";
    vid.dataset.key = v.key || "";
    if(typeof clearFrame === "function"){ clearFrame(); }
    vid.style.display = "block"; ctrl.classList.add("hide");
    (v.url ? (v.url.indexOf("idb:") === 0 ? window.idbGet(v.url) : Promise.resolve(v.url)) : Promise.resolve(driveStream(v.id))).then(function(u){
        vid.src = u; dlLink.href = u; vid.load();
        vid.playbackRate = Number(speedEl.value);
        vid.play().catch(function(){});
    });
    document.querySelectorAll('[data-vi]').forEach(function(b){ b.classList.toggle('active', Number(b.dataset.vi) === index); });
    vid.dataset.id = v.id || "";
}

/* If the video does not play, try Drive directly, then open the Drive player */
const boxEl = document.querySelector('.video-box');
function clearFrame(){
    const f = boxEl.querySelector('iframe');
    if(f){ f.remove(); }
}
vid.addEventListener('error', function(){
    if(!vid.getAttribute('src')) return;
    if(vid.dataset.try === "9"){
        if(vid.dataset.id){ vid.dataset.try = "1"; vid.src = driveStream(vid.dataset.id); vid.load(); vid.play().catch(function(){}); return; }
        vid.pause(); vid.removeAttribute('src'); return;
    }
    if(vid.dataset.try === "0"){
        vid.dataset.try = "1";
        vid.src = "https://drive.usercontent.google.com/download?id=" + vid.dataset.id + "&export=download&confirm=t";
        vid.load();
        vid.play().catch(function(){});
        return;
    }
    vid.pause();
    vid.removeAttribute('src');
    vid.style.display = "none";
    ctrl.classList.add('hide');
    clearFrame();
    const f = document.createElement('iframe');
    f.src = "https://drive.google.com/file/d/" + vid.dataset.id + "/preview";
    f.allow = "autoplay; fullscreen";
    f.setAttribute('allowfullscreen', '');
    f.style.cssText = "width:100%;height:100%;border:0;display:block;";
    boxEl.appendChild(f);
});

function togglePlay(){
    if(vid.paused){ vid.play().catch(function(){}); } else { vid.pause(); }
}

playBtn.onclick = togglePlay;
let hideTimer;
function showCtrl(){
    ctrl.classList.remove('hide');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(function(){
        if(!vid.paused){ ctrl.classList.add('hide'); }
    }, 3500);
}
function hideCtrl(){
    clearTimeout(hideTimer);
    ctrl.classList.add('hide');
}
vid.onclick = function(){
    if(ctrl.classList.contains('hide')){ showCtrl(); } else { hideCtrl(); }
};
ctrl.addEventListener('click', showCtrl);
ctrl.addEventListener('input', showCtrl);
vid.addEventListener('pause', function(){ clearTimeout(hideTimer); ctrl.classList.remove('hide'); });
vid.addEventListener('play', showCtrl);
document.getElementById('backBtn').onclick = function(){ vid.currentTime = Math.max(0, vid.currentTime - 10); };
document.getElementById('fwdBtn').onclick  = function(){ vid.currentTime = Math.min(vid.duration || 0, vid.currentTime + 10); };
speedEl.onchange = function(){ vid.playbackRate = Number(speedEl.value); };

vid.addEventListener('play',  function(){ playBtn.textContent = "❚❚"; });
vid.addEventListener('pause', function(){ playBtn.textContent = "▶"; });
vid.addEventListener('timeupdate', function(){
    if(vid.duration){ seek.value = (vid.currentTime / vid.duration) * 100; }
    timeEl.textContent = fmt(vid.currentTime) + " / " + fmt(vid.duration);
});
vid.addEventListener('loadedmetadata', function(){
    timeEl.textContent = fmt(vid.currentTime) + " / " + fmt(vid.duration);
});
seek.addEventListener('input', function(){
    if(vid.duration){ vid.currentTime = (seek.value / 100) * vid.duration; }
});

/* ===== Video list: videos.json + old list ===== */
let jsonVideos = [];
let apiVideos = [];

const fvEl = document.getElementById('folder-view');
let groups = {latest:[], edited:[], all:[]};

function closeFolder(){ fvEl.classList.remove('show'); document.querySelector('.player-card').classList.remove('folder-mode'); listEl.style.display = ''; }
let folderPushed = false;
function leaveFolder(){
    closeFolder();
    if(folderPushed){ folderPushed = false; history.back(); }
}
window.addEventListener('popstate', function(){ folderPushed = false; closeFolder(); });
function openFolder(name, items){
    fvEl.innerHTML = "";
    const head = document.createElement('div'); head.className = 'fv-head';
    const back = document.createElement('button'); back.className = 'fv-back'; back.textContent = '← Back'; back.onclick = leaveFolder;
    const nm = document.createElement('span'); nm.className = 'fv-name'; nm.textContent = name;
    head.appendChild(back); head.appendChild(nm); fvEl.appendChild(head);
    if(!items.length){ const e = document.createElement('div'); e.className = 'empty'; e.textContent = 'No videos yet'; fvEl.appendChild(e); }
    items.forEach(function(v){
        const i = videos.indexOf(v);
        const r = document.createElement('button'); r.className = 'row'; r.dataset.vi = i; r.textContent = v.title;
        if(/^(REC_|DEMO_REC)/.test(v.id)){ r.classList.add('static'); }
        else { r.onclick = function(){ leaveFolder(); playVideo(i); }; }
        fvEl.appendChild(r);
    });
    try{ vid.pause(); }catch(e){}
    listEl.style.display = 'none';
    fvEl.classList.add('show');
    document.querySelector('.player-card').classList.add('folder-mode');
    if(!folderPushed){ try{ history.pushState({folder:1}, ''); folderPushed = true; }catch(e){} }
    document.querySelectorAll('[data-vi]').forEach(function(b){ b.classList.toggle('active', b.dataset.id === undefined && vid.dataset.id && videos[Number(b.dataset.vi)] && videos[Number(b.dataset.vi)].id === vid.dataset.id); });
}

function renderList(playIndex){
    const seen = {}, all = [];
    jsonVideos.map(function(v){ return {id:v.id, url:v.url || "", key:v.key || v.id, title:v.title, type:v.type || "all"}; })
        .forEach(function(v){ if(v.key && !seen[v.key]){ seen[v.key]=1; all.push(v); } });
    const latest = all.filter(function(v){ return v.type === "latest"; }).slice(0,1);
    const edited = all.filter(function(v){ return v.type === "edited"; });
    const rest   = all.filter(function(v){ return v.type !== "latest" && v.type !== "edited"; });
    videos = latest.concat(edited, rest);
    groups = {latest: latest, edited: edited, all: rest};
    closeFolder();
    listEl.innerHTML = "";
    function btn(label, cls, onclick, off){
        const b = document.createElement('button'); b.type = 'button';
        b.className = cls + (off ? ' off' : '');
        const tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = label;
        b.appendChild(tag); b.onclick = onclick; listEl.appendChild(b);
    }
    btn("Latest Video", "latest", function(){ if(latest.length){ closeFolder(); playVideo(0); } }, !latest.length);
    btn("Edit Video", "folder", function(){ openFolder("Edit Video", edited); });
    btn("Recorded", "folder", function(){ openFolder("Recorded", rest); });
    btn("Dashboard", "dash", function(){ try{ openDashboard(); }catch(e){ alert("Dashboard error: "+e.message); } });
    if(latest.length && playIndex !== -1){ playVideo(0); }
}

let pending = 1, started = false;
function done(){
    pending--;
    if(pending === 0){
        renderList(0);
        if(!videos.length){ titleEl.innerText = "No videos yet"; }
    }
}
function mapVideos(rows){
    return rows.filter(function(v){ return !v.archived && (v.fileId || v.url); })
        .map(function(v){ return {id:v.fileId || "", url:v.url || "", key:v.id, title:v.title, type:v.type, createdAt:v.createdAt || ""}; })
        .sort(function(a,b){ return (b.createdAt || "").localeCompare(a.createdAt || ""); });
}
function fetchVideos(){ return window.ssLoad("videos").then(function(rows){ jsonVideos = mapVideos(rows); }); }
fetchVideos().catch(function(e){ console.warn("videos load", e); }).then(done);

/* ===== Live sync: Admin Panel mein koi bhi change foran yahan nazar aata hai ===== */
function refreshVideos(){
    return fetchVideos().then(function(){
        const playing = vid.getAttribute('src') && !vid.paused;
        const curKey = vid.dataset.key || "";
        const card = document.querySelector('.player-card');
        const openName = card.classList.contains('folder-mode') ? (fvEl.querySelector('.fv-name') || {}).textContent : "";
        const wasPushed = folderPushed;
        renderList(-1);
        if(openName){ folderPushed = wasPushed; openFolder(openName, openName === "Edit Video" ? groups.edited : groups.all); }
        const latest = groups.latest[0];
        const curGone = curKey && !videos.some(function(v){ return v.key === curKey; });
        if(!videos.length){ titleEl.innerText = "No videos yet"; vid.pause(); vid.removeAttribute('src'); return; }
        if(!openName && latest && (curGone || (!playing && latest.key !== curKey))){ playVideo(0); }
        else if(curKey){ const cv = videos.find(function(v){ return v.key === curKey; }); if(cv){ titleEl.innerText = cv.title; } }
    });
}
let liveTimer = null, liveCols = {};
function onLiveChange(col){
    liveCols[col || "*"] = 1;
    clearTimeout(liveTimer);
    liveTimer = setTimeout(function(){
        const c = liveCols; liveCols = {};
        if(c.videos || c["*"]){ refreshVideos().catch(function(){}); }
        if(c.projects || c.sites || c.reels || c["*"]){ if(window.ssDashRefresh){ window.ssDashRefresh(); } }
    }, 400);
}
window.SB.channel("ss-live-" + Math.random().toString(36).slice(2))
    .on("postgres_changes", {event:"*", schema:"public", table:"ss_docs"}, function(p){
        onLiveChange((p.new && p.new.collection) || (p.old && p.old.collection));
    })
    .subscribe();
document.addEventListener("visibilitychange", function(){ if(!document.hidden){ onLiveChange("*"); } });

</script>


</body>
